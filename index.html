<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>True Alien Aid</title>
<meta name="description" content="True Alien Aid makes games and apps for Android.">
<style>
  :root { color-scheme: light dark; --text: #151a22; --muted: #4a5566; --bg: #ffffff; --link: #2f5bd3; --line: #dce3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e3e8f0; --muted: #a8b3c4; --bg: #0e131a; --link: #9db6ff; --line: #2a3342; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 20px 64px; }
  h1 { font-size: 32px; line-height: 1.2; margin: 0 0 6px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: var(--muted); margin: 0; }
  section { border-top: 1px solid var(--line); margin-top: 32px; padding-top: 24px; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>True Alien Aid</h1>
  <p class="muted">Games and apps for Android.</p>

  <section>
    <h2>Minesweeper 3D</h2>
    <p>Minesweeper in a cube: spin it, dig through the layers and find every mine. Includes the classic flat game too.</p>
    <p><a href="minesweeper/privacy/">Privacy policy</a></p>
  </section>

  <section>
    <h2>Contact</h2>
    <p><a href="mailto:truealienaid.support@gmail.com">truealienaid.support@gmail.com</a></p>
  </section>
</main>
</body>
</html>
